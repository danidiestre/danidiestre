<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background shape -->
    <rect x="50" y="50" width="500" height="300" rx="20" fill="#F3F4F6"/>
    
    <!-- Product Manager -->
    <circle cx="200" cy="150" r="40" fill="#3B82F6"/>
    <text x="200" y="155" text-anchor="middle" fill="white" font-family="Inter" font-size="14">PM</text>
    
    <!-- Product Designer -->
    <circle cx="400" cy="150" r="40" fill="#EC4899"/>
    <text x="400" y="155" text-anchor="middle" fill="white" font-family="Inter" font-size="14">PD</text>
    
    <!-- Connecting line -->
    <path d="M240 150 L360 150" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Team collaboration indicators -->
    <circle cx="300" cy="250" r="30" fill="#10B981"/>
    <text x="300" y="255" text-anchor="middle" fill="white" font-family="Inter" font-size="12">Team</text>
    
    <!-- Connection lines to team -->
    <path d="M220 180 L285 230" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M380 180 L315 230" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4"/>
</svg> 